<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Shippori+Mincho+B1:wght@800&family=Hanken+Grotesk:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #f6f3ec; color: #1d2027; font-family: "Hanken Grotesk", "Zen Kaku Gothic New", sans-serif; overflow: hidden; position: relative; }
  .logo { position: absolute; left: 72px; top: 60px; height: 44px; }
  h1 { position: absolute; left: 72px; top: 156px; width: 640px; margin: 0; font: 400 68px/1 "Gloock", serif; letter-spacing: -0.02em; }
  h1 span { display: block; }
  h1 span + span { color: #c63f2a; }
  body.ja h1 { width: 650px; font: 800 58px/1.3 "Shippori Mincho B1", serif; letter-spacing: 0.01em; }
  .url { position: absolute; left: 72px; bottom: 58px; font: 500 24px "IBM Plex Mono", monospace; color: #3d424c; }
  .card { position: absolute; right: 64px; top: 120px; width: 400px; min-height: 380px; padding: 34px; border-radius: 16px; background: #fffdf8; box-shadow: 0 30px 70px -30px rgba(29,32,39,.35), 0 0 0 1px rgba(29,32,39,.06); }
  .card .label { font: 500 14px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #6e727b; }
  body.ja .card .label { font-family: "Zen Kaku Gothic New"; letter-spacing: .1em; text-transform: none; }
  .card h2 { margin: 8px 0 0; font: 400 34px/1.1 "Gloock", serif; }
  body.ja .card h2 { font: 800 30px/1.3 "Shippori Mincho B1", serif; }
  .card .n { margin-top: 18px; color: #c63f2a; font: 400 120px/0.9 "Gloock", serif; }
  .card .n small { font: 600 22px "Hanken Grotesk", "Zen Kaku Gothic New", sans-serif; margin-left: 10px; letter-spacing: 0; }
  body.en .card .n small { display: block; margin: 14px 0 0; }
  .card .hours { margin-top: 16px; font: 500 18px "Hanken Grotesk", "Zen Kaku Gothic New", sans-serif; color: #3d424c; }
  .card .meter { display: flex; height: 10px; margin-top: 24px; border-radius: 999px; overflow: hidden; background: #eee8dc; }
  .card .meter i { display: block; height: 100%; }
  .stamp { position: absolute; right: 84px; top: 486px; padding: 8px 18px; border: 4px solid #c63f2a; border-radius: 8px; color: #c63f2a; font: 400 28px/1 "Gloock", serif; letter-spacing: .06em; text-transform: uppercase; rotate: -8deg; }
  body.ja .stamp { font: 800 30px/1 "Shippori Mincho B1", serif; letter-spacing: .25em; }
</style>
</head>
<body>
  <img class="logo" src="../public/lockup.svg" alt="" />
  <h1><span data-t="h1a"></span><span data-t="h1b"></span></h1>
  <div class="url">kitehand.ai</div>
  <div class="card">
    <div class="label" data-t="label"></div>
    <h2 data-t="role"></h2>
    <div class="n"><span data-t="n"></span><small data-t="unit"></small></div>
    <div class="meter"><i style="width:72%;background:#2c3e63"></i><i style="width:7%;background:#c63f2a"></i><i style="width:21%;background:#c9c3b6"></i></div>
    <div class="hours" data-t="hours"></div>
  </div>
  <div class="stamp" data-t="stamp"></div>
  <script>
    const T = {
      en: { h1a: "Short-handed?", h1b: "Hand it to Kitehand.", label: "Kitehand takes", role: "Order entry", n: "0.7", unit: "of a full-time job", hours: "118 of its 150 hours a month", stamp: "Handed over" },
      ja: { h1a: "人手が足りない仕事は、", h1b: "AI の担当者に。", label: "担当者が引き受ける仕事", role: "受注事務", n: "0.7", unit: "人分", hours: "月150時間のうち、118時間", stamp: "引受済" },
    };
    const lang = location.hash.slice(1) || "en";
    document.body.classList.add(lang);
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[lang][el.dataset.t]));
  </script>
</body>
</html>
